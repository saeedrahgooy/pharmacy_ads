{% extends 'base/base.html' %}
{% block title %}ورود با OTP{% endblock %}

{% block content %}
<div class="row">
  <div class="col s12 m6 offset-m3">
    <div class="card z-depth-2">
      <div class="card-content">
        <span class="card-title center">ورود با OTP</span>

        <form method="post">
          {% csrf_token %}

          <!-- phone field -->
          <div class="input-field">
            <i class="material-icons prefix">phone</i>
            <input id="phone" type="tel" name="phone" class="validate" required dir="ltr">
            <label for="phone">شماره موبایل</label>
            <span class="helper-text" data-error="شماره معتبر نیست" data-success="اوکی"></span>
          </div>

          <!-- submit -->
          <div class="center">
            <button class="btn waves-effect waves-light blue" type="submit">
              ارسال کد
              <i class="material-icons right">send</i>
            </button>
          </div>
        </form>
      </div>

      <div class="card-action center">
        <a href="/accounts/verify/">تایید کد</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
